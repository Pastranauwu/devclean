# GoReleaser configuration for devclean.
# Un solo binario estático por plataforma; checksums y firmas para GitHub
# Releases.
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: devclean
    main: ./cmd/devclean
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
