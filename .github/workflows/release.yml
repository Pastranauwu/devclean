name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        run: go test ./...

      # si la release ya existe (p. ej. un run local de goreleaser la
      # publicó antes que el CI), re-publicar choca con 422 already_exists
      # en los assets y el workflow queda rojo de mentira. Se salta el
      # paso y el run termina verde: el release ya está. Para republicalo
      # hay que borrar el release y re-correr.
      - name: ¿release ya existe?
        id: existe
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "ya_existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "ya_existe=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: goreleaser
        if: steps.existe.outputs.ya_existe != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}